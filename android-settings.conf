# Android settings the phone should have, applied from the development host with
# `android-settings apply` and compared with `android-settings check`. GrapheneOS
# keeps some of these out of its Settings app, so this file is their only record.
# One per line: NAMESPACE KEY VALUE, where NAMESPACE is global, secure, or system.

# Holding power opens the digital assistant (June). GrapheneOS hides this choice;
# 5 is Android's "digital assistant" action. Set 2026-11-04.
global power_button_long_press 5

# Power + volume up opens the power menu (Lockdown, restart, power off), since
# holding power now opens the assistant. 2 is Android's power menu. Set 2026-11-04.
global key_chord_power_volume_up 2
