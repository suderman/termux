# Keys and look follow the NixOS tmux config (modules/home/default/options/tmux
# in /etc/nixos), which in turn follows Herdr. Termux-only parts say so.

# Termux: zsh lives under $PREFIX.
set -g default-command /data/data/com.termux/files/usr/bin/zsh
set -g default-shell /data/data/com.termux/files/usr/bin/zsh
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.local/share/tmux/plugins/"

# Options Home Manager sets on NixOS.
set -g default-terminal tmux-256color
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g display-time 4000
setw -g aggressive-resize on

# Match Herdr's Alt-z prefix; press it twice to send Alt-z to the pane.
set -g prefix M-z
bind-key M-z send-prefix

# Unbind ^b to free it up
unbind C-b

# Set window and pane index to 1 ('0' is at the wrong end of the keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Disallow automatic window naming
set -g allow-rename off

# Allow mousing
set -g mouse on

# Image preview passthrough, as for Kitty on NixOS.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ⌥N New Session
bind-key -n M-N new

# ⌥a Switch between Sessions
bind-key -n M-a choose-session

# Prefix+d detaches this client from the session.
bind-key d detach-client

# ⌥D Detach others from Session
bind-key -n M-D detach-client -a

# ⌥T New Tab
bind-key -n M-T new-window -c "#{pane_current_path}"

# Prefix+, renames the window (tmux default); prefix+. renames the session.
bind-key . command-prompt -I '#S' { rename-session "%%" }

# Prefix+[ and prefix+] navigate tabs; prefix+{ and prefix+} reorder them.
bind-key [ previous-window
bind-key ] next-window
bind-key '{' swap-window -t -1
bind-key '}' swap-window -t +1

# Prefix+1..9 select tabs.
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9

# Prefix+u/i split a tmux pane even when an editor has focus.
bind-key u split-window
bind-key i split-window -h

# ⌥O Rotate Panes
bind-key -n M-O rotate-window

# Prefix+r opens resize mode; Escape or Enter leaves it.
bind-key r switch-client -T resize
bind-key -T resize h resize-pane -L 5 \; switch-client -T resize
bind-key -T resize j resize-pane -D 5 \; switch-client -T resize
bind-key -T resize k resize-pane -U 5 \; switch-client -T resize
bind-key -T resize l resize-pane -R 5 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root
bind-key -T resize Enter switch-client -T root

# ⌥W Close Pane or Window
bind-key -n M-W kill-pane

# ⌥; ⌥: Command Mode
bind-key -n M-\; command-prompt
bind-key -n M-: command-prompt

# Edger (plugin below) binds Alt-h/j/k/l, Alt-H/J/K/L, Alt-u/i, and Alt-w in the
# root table. Two presses at the right edge create a tab; two at the bottom
# create a session. Keep native pane movement in copy mode.
bind-key o select-pane -l
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

# Match Herdr's prefix+m copy mode; keep Alt keys for pane apps.
bind-key m copy-mode
bind-key v paste-buffer

setw -g mode-keys vi
unbind-key -T copy-mode-vi Escape
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi m send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Termux: copy to the Android clipboard, where tmux-yank does it on NixOS.
bind-key -T copy-mode-vi c send-keys -X copy-pipe-and-cancel termux-clipboard-set
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel termux-clipboard-set
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel termux-clipboard-set

# Extrakto (prefix+Tab) picks text from the pane with fzf.
set -g set-clipboard on
set -g @extrakto_clip_tool_run "fg"
set -g @extrakto_clip_tool "termux-clipboard-set"
set -g @extrakto_popup_size "65%"
set -g @extrakto_grab_area "window 500"

# Theme: the dark Stylix colors NixOS applies, set directly instead of
# through a theme plugin.
set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#a6adc8"
set -g message-style "fg=#f5e0dc,bg=#313244"
set -g message-command-style "fg=#f5e0dc,bg=#313244"
set -g mode-style "fg=#a6adc8,bg=#313244"
setw -g window-status-style "fg=#cdd6f4,bg=#1e1e2e"
setw -g window-status-current-style "fg=#f9e2af,bg=#1e1e2e"
setw -g window-status-activity-style "fg=#cdd6f4,bg=#1e1e2e"

# Give the window list room
set -g status-left-length 30
set -g status-right-length 60
set -g status-justify centre

# Left: session + prefix indicator (simple)
set -g status-left '#[bg=#50fa7b,fg=#282a36]#{?client_prefix,#[bg=#f1fa8c],} ☺ #[default] #[bold]#S#[default] '

# Windows: clearer formats
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bold,reverse] #I:#W #[default]'

# Right: date and time. Continuum appends its autosave check here.
set -g status-right '#[fg=#282a36,bg=#ff79c6] %Y-%m-%d %H:%M #[default]'

# Termux: the status line shows minutes and runs continuum's check on each
# refresh, so refresh once a minute rather than every 5 s to spare the battery.
set -g status-interval 60

# Stop a session's em daemon when tmux closes the session. setsid lets the
# stop outlive a server that exits with its last session.
set-hook -g session-closed[90] {
  run-shell "setsid -f ~/bin/em --stop-tmux '#{socket_path}' '#{pid}' '#{hook_session}' >/dev/null 2>&1"
}

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'suderman/edger'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'laktak/extrakto'

# Termux: Android can stop Termux, so save sessions every 15 minutes and
# restore them when tmux starts.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Keep this line at the very bottom of tmux.conf
run '~/.local/share/tmux/plugins/tpm/tpm'
