# Mail settings for gem, read by bin/mail-sync, bin/notmuch-mail, and the
# mail-sync service. After a change, deploy and run: sv restart mail-sync

# Minutes between background syncs. Android may run one late while dozing.
MAIL_SYNC_MINUTES=15

# Host Emacs reads mail from over SSH while gem has no local mail store.
MAIL_FALLBACK_HOST=kit
